server {
    listen 80;
    server_name _;

    location = /picpilot-canvas-brand.js {
        alias /usr/share/nginx/picpilot-assets/picpilot-canvas-brand.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location = /picpilot-canvas-bridge.js {
        alias /usr/share/nginx/picpilot-assets/picpilot-canvas-bridge.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/nova/proxy/ {
        return 403;
    }

    location = /picpilot-brand.png {
        alias /usr/share/nginx/picpilot-assets/picpilot-brand.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /picpilot-canvas-manifest.json {
        alias /usr/share/nginx/picpilot-assets/picpilot-canvas-manifest.json;
        default_type application/manifest+json;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://nova-canvas-runtime:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

    }
}
