services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: picpilot
      POSTGRES_DB: picpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the quick-start initializer first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - database:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picpilot -d picpilot"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://picpilot:${POSTGRES_PASSWORD}@db:5432/picpilot?sslmode=disable
      PICPILOT_LISTEN: 0.0.0.0:8080
      PICPILOT_DATA_DIR: /data
      PICPILOT_HEIF_ENABLED: ${PICPILOT_HEIF_ENABLED:-true}
      PICPILOT_ALLOWED_ORIGINS: ${PICPILOT_PUBLIC_URL:-http://localhost:8080},${PICPILOT_ADMIN_URL:-http://localhost:8081}
      PICPILOT_TRUSTED_PROXY_CIDRS: ${PICPILOT_PROXY_ADDRESS:-172.28.56.10}/32
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - application:/data
    networks: [application, database]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 45s
    mem_limit: 1536m
    cpus: 2
    logging: *logging

  user:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args: {APP: user}
    restart: unless-stopped
    environment:
      GO_API_INTERNAL_URL: http://api:8080
    depends_on:
      api: {condition: service_healthy}
    networks: [application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 768m
    logging: *logging

  admin:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args: {APP: admin}
    restart: unless-stopped
    environment:
      GO_API_INTERNAL_URL: http://api:8080
    depends_on:
      api: {condition: service_healthy}
    networks: [application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    logging: *logging

  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
    restart: unless-stopped
    environment:
      PICPILOT_PUBLIC_URL: ${PICPILOT_PUBLIC_URL:-http://localhost:8080}
      PICPILOT_ADMIN_URL: ${PICPILOT_ADMIN_URL:-http://localhost:8081}
    depends_on:
      user: {condition: service_healthy}
      admin: {condition: service_healthy}
    ports:
      - ${PICPILOT_BIND_ADDRESS:-127.0.0.1}:${PICPILOT_HTTP_PORT:-8080}:8080
      - ${PICPILOT_BIND_ADDRESS:-127.0.0.1}:${PICPILOT_ADMIN_PORT:-8081}:8081
    volumes:
      - tls_data:/data
      - tls_config:/config
    networks:
      application:
        ipv4_address: ${PICPILOT_PROXY_ADDRESS:-172.28.56.10}
    logging: *logging

  maintenance:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: deploy/maintenance.Dockerfile
    environment:
      PGHOST: db
      PGUSER: picpilot
      PGDATABASE: picpilot
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PICPILOT_EDITION: platform
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - application:/source
      - ./backups:/backup
      - ./.env:/settings.env:ro
    networks: [database]

volumes:
  database:
  application:
  tls_data:
  tls_config:
networks:
  database:
    internal: true
  application:
    ipam:
      config:
        - subnet: ${PICPILOT_NETWORK_SUBNET:-172.28.56.0/24}
